<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Vanina Giorgetti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white-broken:#F8F7F2; --petrol:#203B3A; --green-gray:#667774; --line:#C9C8C0;
    --font-serif:'Cormorant Garamond', Georgia, serif; --font-sans:'Manrope', -apple-system, sans-serif;
    --radius-btn:24px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:var(--white-broken); color:var(--petrol);
    font-family:var(--font-sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
  }
  img{max-width:120px; margin-bottom:2rem;}
  .mark{font-family:var(--font-serif); font-size:6rem; color:var(--petrol); opacity:.15; line-height:1; margin-bottom:.5rem;}
  h1{font-family:var(--font-serif); font-weight:500; font-size:clamp(1.6rem,4vw,2.2rem); margin:0 0 .8rem;}
  p{color:var(--green-gray); max-width:44ch; margin:0 0 2rem;}
  .btn{
    display:inline-flex; align-items:center; gap:.6rem;
    background:var(--petrol); color:var(--white-broken);
    padding:.9rem 1.8rem; border-radius:var(--radius-btn);
    font-weight:600; text-decoration:none;
  }
  .btn svg{width:18px; height:18px;}
</style>
</head>
<body>
  <img src="logo.webp" alt="Vanina Giorgetti — Abogada">
  <span class="mark" aria-hidden="true">404</span>
  <h1>Esta página no está disponible</h1>
  <p>El contenido que buscás no existe o fue movido. Volvé al inicio para seguir navegando el sitio.</p>
  <a class="btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5l-7 7 7 7M4 12h16"/></svg>
    Volver al inicio
  </a>
</body>
</html>
